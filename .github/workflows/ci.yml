name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JUCE_NOZZLE_JUCE_TAG: '8.0.13'
  CCACHE_DIR: ${{ github.workspace }}/.ci/ccache
  SCCACHE_DIR: ${{ github.workspace }}/.ci/sccache
  SCCACHE_CACHE_SIZE: 2G

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-universal
          - os: windows-2025-vs2026
            platform: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Restore JUCE source cache
        id: juce-source-cache
        uses: actions/cache@v5
        with:
          path: .ci/JUCE
          key: juce-source-${{ runner.os }}-${{ env.JUCE_NOZZLE_JUCE_TAG }}

      - name: Populate JUCE source cache
        shell: bash
        run: |
          if [ ! -d .ci/JUCE/.git ]; then
            rm -rf .ci/JUCE
            git clone --depth 1 --branch "$JUCE_NOZZLE_JUCE_TAG" https://github.com/juce-framework/JUCE.git .ci/JUCE
          fi
          git -C .ci/JUCE rev-parse --short HEAD
          git -C .ci/JUCE describe --tags --exact-match

      - name: Restore ccache
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: .ci/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set up ccache
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi
          mkdir -p .ci/ccache
          ccache --version
          ccache --set-config=cache_dir="$GITHUB_WORKSPACE/.ci/ccache"
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Restore sccache
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: .ci/sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Set up sccache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install_dir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install_dir) {
            Write-Error 'Visual Studio installation with MSVC x64 tools was not found.'
            exit 1
          }
          $vcvars = Join-Path $install_dir 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvars64.bat was not found: $vcvars"
            exit 1
          }
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -match '^(Path|INCLUDE|LIB|LIBPATH|UCRTVersion|UniversalCRTSdkDir|VCIDEInstallDir|VCINSTALLDIR|VCToolsInstallDir|VCToolsRedistDir|VCToolsVersion|VisualStudioVersion|VSINSTALLDIR|WindowsLibPath|WindowsSdkBinPath|WindowsSdkDir|WindowsSDKLibVersion|WindowsSDKVersion|__VSCMD_PREINIT_PATH)$') {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }

      - name: Configure
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ci/ccache
          SCCACHE_DIR: ${{ github.workspace }}/.ci/sccache
          SCCACHE_CACHE_SIZE: 2G
        run: |
          juce_source_dir="$(pwd)/.ci/JUCE"
          common_args=(
            -DJUCE_NOZZLE_BUILD_EXAMPLES=ON
            -DJUCE_NOZZLE_JUCE_TAG="$JUCE_NOZZLE_JUCE_TAG"
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$juce_source_dir"
          )
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S . -B build \
              "${common_args[@]}" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S . -B build -G Ninja \
              "${common_args[@]}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          fi

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ci/ccache
          SCCACHE_DIR: ${{ github.workspace }}/.ci/sccache
          SCCACHE_CACHE_SIZE: 2G
        run: cmake --build build --config Release --target NozzleReceiverPlugin_All NozzleSenderStandalone NozzleReceiverStandalone NozzleStandaloneSmoke

      - name: Show compiler cache stats
        if: always()
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ci/ccache
          SCCACHE_DIR: ${{ github.workspace }}/.ci/sccache
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            ccache --show-stats
          elif command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "sccache is not available"
            exit 1
          fi

      - name: Run standalone smoke
        shell: bash
        run: |
          smoke_executable=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            for candidate in build/Release/NozzleStandaloneSmoke.exe build/NozzleStandaloneSmoke.exe; do
              if [ -f "$candidate" ]; then
                smoke_executable="$candidate"
                break
              fi
            done
          else
            smoke_executable="build/NozzleStandaloneSmoke"
          fi
          if [ ! -f "$smoke_executable" ]; then
            echo "NozzleStandaloneSmoke executable not found" >&2
            find build -name 'NozzleStandaloneSmoke*' -print >&2
            exit 1
          fi
          "$smoke_executable"

      - name: Run standalone app interop smoke
        shell: bash
        run: python3 scripts/standalone-app-smoke.py --build-dir build --evidence-dir build/standalone-app-smoke-evidence

      - name: Upload standalone app smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-app-smoke-evidence-${{ matrix.platform }}
          path: build/standalone-app-smoke-evidence
          if-no-files-found: warn

      - name: Verify macOS universal plugin binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binaries_file="build/macos-binaries.txt"
          find build -path '*/Nozzle Receiver.app/Contents/MacOS/Nozzle Receiver' -o -path '*/Nozzle Receiver.vst3/Contents/MacOS/Nozzle Receiver' -o -path '*/Nozzle Receiver.component/Contents/MacOS/Nozzle Receiver' -o -path '*/Nozzle Sender Standalone.app/Contents/MacOS/Nozzle Sender Standalone' -o -path '*/Nozzle Receiver Standalone.app/Contents/MacOS/Nozzle Receiver Standalone' | sort > "$binaries_file"
          binary_count=$(wc -l < "$binaries_file" | tr -d ' ')
          if [ "$binary_count" -ne 5 ]; then
            echo "Expected 5 macOS binaries, found ${binary_count}" >&2
            cat "$binaries_file" >&2
            exit 1
          fi
          while IFS= read -r binary; do
            test -f "$binary"
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            echo "$archs" | grep -q "arm64" || { echo "Missing arm64 slice in $binary"; exit 1; }
            echo "$archs" | grep -q "x86_64" || { echo "Missing x86_64 slice in $binary"; exit 1; }
          done < "$binaries_file"

      - name: Stage release package
        id: package
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          platform="${{ matrix.platform }}"
          artifact="macos-universal windows-x64"
          case " $artifact " in
            *" $platform "*) ;;
            *) echo "unsupported package platform: $platform" >&2; exit 1 ;;
          esac
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            package_name="juce-nozzle-${GITHUB_REF_NAME}-${platform}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            package_name="juce-nozzle-latest-${short_sha}-${platform}"
          else
            package_name="juce-nozzle-ci-${short_sha}-${platform}"
          fi
          python3 scripts/package-release.py --build-dir build --platform "$platform" --package-name "$package_name" --output-dir dist
          test -f "dist/${package_name}.zip"
          python3 scripts/verify-package.py --platform "${{ matrix.platform }}" "dist/${package_name}.zip"
          echo "package_root=${package_name}" >> "$GITHUB_OUTPUT"
          echo "package_name=${package_name}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.package_root }}
          path: dist/${{ steps.package.outputs.package_name }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Move latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: juce-nozzle-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and manifest
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            prefix="juce-nozzle-latest-${short_sha}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            prefix="juce-nozzle-${GITHUB_REF_NAME}"
          else
            echo "unsupported release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          packages=(
            "dist/${prefix}-macos-universal.zip"
            "dist/${prefix}-windows-x64.zip"
          )
          for package in "${packages[@]}"; do
            test -f "$package"
          done
          : > SHA256SUMS
          for package in "${packages[@]}"; do
            checksum=$(sha256sum "$package" | awk '{print $1}')
            printf '%s  %s\n' "$checksum" "$(basename "$package")" >> SHA256SUMS
          done
          python3 scripts/write-release-manifest.py --output manifest.json "${packages[@]}"
          cat SHA256SUMS
          cat manifest.json

      - name: Check versioned release asset does not exist
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          mapfile -t package_paths < <(find dist -maxdepth 1 -name "juce-nozzle-${release_tag}-*.zip" -print | sort)
          packages=()
          for path in "${package_paths[@]}"; do
            packages+=("$(basename "$path")")
          done
          packages+=(SHA256SUMS manifest.json)
          if release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq .id 2>/dev/null); then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[].name' > existing-assets.txt
            for asset in "${packages[@]}"; do
              if grep -Fx "$asset" existing-assets.txt; then
                echo "versioned release asset already exists: $asset" >&2
                exit 1
              fi
            done
          else
            echo "No existing release for $release_tag; create step will create it."
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            release_tag="latest"
            prefix="juce-nozzle-latest-${short_sha}"
            title="Latest development snapshot"
            notes="Mutable JUCE/nozzle development snapshot from main. Commit: ${GITHUB_SHA}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            prefix="juce-nozzle-${GITHUB_REF_NAME}"
            title="$release_tag"
            notes="Release $release_tag"
          else
            echo "unsupported release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          assets=(
            "dist/${prefix}-macos-universal.zip"
            "dist/${prefix}-windows-x64.zip"
            SHA256SUMS
            manifest.json
          )
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            if release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq .id 2>/dev/null); then
              gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[].id' > release-asset-ids.txt
              while IFS= read -r asset_id; do
                if [ -n "$asset_id" ]; then
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                fi
              done < release-asset-ids.txt
              gh release edit "$release_tag" --repo "${GITHUB_REPOSITORY}" --title "$title" --notes "$notes" --prerelease
              gh release upload "$release_tag" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "$release_tag" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "$title" --notes "$notes" --prerelease
            fi
          else
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq .id >/dev/null 2>&1; then
              gh release upload "$release_tag" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "$release_tag" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --title "$title" --notes "$notes"
            fi
          fi
          gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" --json url,assets --jq '.url, (.assets[].name)'
